# CI: roda a cada push na main e em todo pull request.
# Se qualquer passo falhar, o check fica vermelho no GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Se chegar um push novo no mesmo branch, cancela a execução antiga.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O workflow só precisa ler o código.
permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm # reaproveita downloads do npm entre execuções

      - name: Instalar dependências (exatamente as do package-lock.json)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          # O build só precisa que as variáveis existam; ele não conecta no
          # Supabase. Valores falsos evitam colocar segredos no CI.
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-falsa-para-build

  banco:
    name: Banco local (Supabase) e testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (inclui a Supabase CLI)
        run: npm ci

      # Sobe o mesmo Supabase do "npm run db:start", aplicando as migrações de
      # supabase/migrations. Deixa de fora o que os testes não usam (painel,
      # logs, storage...) para subir mais rápido.
      - name: Subir o Supabase local (Docker)
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Testes de integração (banco)
        run: npm run test:db

      - name: Derrubar o Supabase
        if: always()
        run: npx supabase stop --no-backup
